services:
  django-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django-docker
    volumes:
      - ./static:/app/staticfiles
    env_file:
      - .env.prod

  frontend-proxy:
    image: nginx:latest
    ports:
      - "8001:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./static:/static:rw
    depends_on:
      django-web: